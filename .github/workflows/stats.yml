# Раз в час обновляет stats.json настоящими цифрами из Shopify
name: Update Shopify stats

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats from Shopify
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python .update_stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet stats.json; then echo "Без изменений"; exit 0; fi
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git commit -m "Обновление цифр из Shopify"
          git push
